<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#EDE8E1"/>
    </linearGradient>
    <linearGradient id="terracottaBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C46838"/>
      <stop offset="100%" stop-color="#8B401C"/>
    </linearGradient>
  </defs>

  <!-- Light squircle container: high contrast on both light and dark browser chrome -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgLight)" stroke="url(#terracottaBorder)" stroke-width="2.75"/>

  <!-- Subtle inner inset rim -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="11.5" fill="none" stroke="#D5CDCA" stroke-width="0.75" opacity="0.6"/>

  <!-- QA status accent pip -->
  <circle cx="50" cy="14" r="3.2" fill="#A4552C"/>

  <!-- Recognizable 'SS' Monogram (Shashank Shinde) -->
  <text 
    x="31" 
    y="44" 
    font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif" 
    font-size="34" 
    font-weight="800" 
    letter-spacing="-1.5" 
    fill="#1A1818" 
    text-anchor="middle"
  >SS</text>
</svg>
