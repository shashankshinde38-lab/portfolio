<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#22C55E" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- QA Bug Outline (Subtle QA Engineering Symbol) -->
  <!-- Bug antennae -->
  <path d="M26 18 Q22 12 18 11" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <circle cx="18" cy="11" r="1.5" fill="#38BDF8"/>
  <path d="M38 18 Q42 12 46 11" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <circle cx="46" cy="11" r="1.5" fill="#38BDF8"/>

  <!-- Bug Head -->
  <path d="M26 21 C26 17 38 17 38 21 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- Bug Legs -->
  <path d="M19 28 L12 25" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
  <path d="M18 36 L11 37" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
  <path d="M20 44 L13 48" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
  
  <path d="M45 28 L52 25" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
  <path d="M46 36 L53 37" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
  <path d="M44 44 L51 48" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.65"/>

  <!-- Bug Body / Shield -->
  <path d="M24 23 H40 C45 23 46 32 45 40 C43 47 34 51 32 51 C30 51 21 47 19 40 C18 32 19 23 24 23 Z" 
        fill="#0D1524" stroke="#38BDF8" stroke-width="1.75"/>

  <!-- Prominent QA Verified Checkmark (Dominates at 16x16 for instant recognition) -->
  <path d="M22 36 L28.5 43 L43 25" 
        fill="none" 
        stroke="url(#checkGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- QA Monogram Badge in Top Right Corner -->
  <text x="50" y="20" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="900" fill="#38BDF8" opacity="0.9" text-anchor="middle">QA</text>
</svg>
