  <text x="56" y="235" fill="#81C784" font-family="monospace" font-size="10.5">BigDecimal.valueOf(grossAmount)</text>
  <text x="56" y="252" fill="#81C784" font-family="monospace" font-size="10.5">  .multiply(discountRatio)</text>
  <text x="56" y="270" fill="#81C784" font-family="monospace" font-size="10.5">  .setScale(2, RoundingMode.HALF_EVEN)</text>
  <text x="56" y="290" fill="#E8E4E0" font-family="'Onest', sans-serif" font-size="10">Audit Proof: Verified 0.00 paise drift</text>

