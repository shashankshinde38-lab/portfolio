<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMicro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181528"/>
      <stop offset="100%" stop-color="#241E38"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bgMicro)" rx="8"/>
  <rect x="2" y="2" width="636" height="396" fill="none" stroke="#7E57C2" stroke-width="1.5" stroke-opacity="0.3" rx="7"/>

  <!-- Title -->
  <text x="32" y="44" fill="#E8E4E0" font-family="'Onest', sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">API GATEWAY · WIREMOCK CONTRACT TESTING &amp; IDEMPOTENCY</text>
  <rect x="470" y="28" width="138" height="24" rx="12" fill="#7E57C2" fill-opacity="0.25" stroke="#7E57C2" stroke-width="1"/>
  <text x="539" y="44" fill="#B39DDB" font-family="'Onest', sans-serif" font-size="11" font-weight="600" text-anchor="middle">WIREMOCK &amp; PACT</text>

  <!-- Left: Service Mesh Contract Verification Diagram -->
  <rect x="32" y="76" width="310" height="295" rx="6" fill="#13101F" stroke="#2F2547" stroke-width="1"/>
  <text x="48" y="102" fill="#D5CDCA" font-family="'Onest', sans-serif" font-size="12" font-weight="700">SERVICE MESH CONTRACT GATES</text>

  <!-- Consumer -> Provider Node Diagram -->
  <g transform="translate(48, 120)">
    <!-- Consumer -->
    <rect x="0" y="20" width="70" height="45" rx="5" fill="#201A38" stroke="#7E57C2" stroke-width="1.2"/>
    <text x="35" y="42" fill="#EDE7F6" font-family="'Onest', sans-serif" font-size="10" font-weight="700" text-anchor="middle">CLIENT</text>
    <text x="35" y="55" fill="#B39DDB" font-family="monospace" font-size="8" text-anchor="middle">Consumer</text>

    <!-- WireMock Stub Interceptor -->
    <rect x="105" y="10" width="80" height="65" rx="5" fill="#311B92" stroke="#9575CD" stroke-width="1.5"/>
    <text x="145" y="32" fill="#FFFFFF" font-family="'Onest', sans-serif" font-size="10" font-weight="700" text-anchor="middle">WIREMOCK</text>
    <text x="145" y="46" fill="#D1C4E9" font-family="monospace" font-size="8" text-anchor="middle">Mock Server</text>
    <text x="145" y="60" fill="#81C784" font-family="monospace" font-size="8" text-anchor="middle">HTTP 200 OK</text>

    <!-- Provider Service -->
    <rect x="220" y="20" width="70" height="45" rx="5" fill="#201A38" stroke="#7E57C2" stroke-width="1.2"/>
    <text x="255" y="42" fill="#EDE7F6" font-family="'Onest', sans-serif" font-size="10" font-weight="700" text-anchor="middle">BACKEND</text>
    <text x="255" y="55" fill="#B39DDB" font-family="monospace" font-size="8" text-anchor="middle">Provider</text>
  </g>

  <!-- JSON Schema Validation Code Box -->
  <rect x="48" y="205" width="278" height="150" rx="4" fill="#0E0B17" stroke="#2F2547" stroke-width="1"/>
  <text x="60" y="224" fill="#7E57C2" font-family="monospace" font-size="9">// JSON Schema Assertion (AJV / RestAssured)</text>
  <text x="60" y="242" fill="#E8E4E0" font-family="monospace" font-size="9">pm.response.to.have.jsonSchema({</text>
  <text x="75" y="258" fill="#B39DDB" font-family="monospace" font-size="9">"type": "object",</text>
  <text x="75" y="274" fill="#B39DDB" font-family="monospace" font-size="9">"required": ["booking_id", "hmac_signature"],</text>
  <text x="75" y="290" fill="#B39DDB" font-family="monospace" font-size="9">"properties": {</text>
  <text x="90" y="306" fill="#81C784" font-family="monospace" font-size="9">"fare_amount": { "type": "number", "minimum": 0.01 }</text>
  <text x="75" y="322" fill="#B39DDB" font-family="monospace" font-size="9">}</text>
  <text x="60" y="338" fill="#81C784" font-family="monospace" font-size="9">}); // ✓ Asserted 0 Schema Violations</text>

  <!-- Right: Contract Assertions Summary -->
  <rect x="360" y="76" width="248" height="295" rx="6" fill="#13101F" stroke="#2F2547" stroke-width="1"/>
  <text x="376" y="102" fill="#D5CDCA" font-family="'Onest', sans-serif" font-size="12" font-weight="700">ASSERTION REPORTOIRE</text>

  <g transform="translate(376, 125)">
    <text x="0" y="16" fill="#B5ACA8" font-family="'Onest', sans-serif" font-size="11">Idempotency-Key Mutex</text>
    <text x="180" y="16" fill="#81C784" font-family="monospace" font-size="10" font-weight="700">PASS ✓</text>

    <text x="0" y="46" fill="#B5ACA8" font-family="'Onest', sans-serif" font-size="11">JWT Expiry Drift Clock</text>
    <text x="180" y="46" fill="#81C784" font-family="monospace" font-size="10" font-weight="700">PASS ✓</text>

    <text x="0" y="76" fill="#B5ACA8" font-family="'Onest', sans-serif" font-size="11">Rate Limiter (HTTP 429)</text>
    <text x="180" y="76" fill="#81C784" font-family="monospace" font-size="10" font-weight="700">PASS ✓</text>

    <text x="0" y="106" fill="#B5ACA8" font-family="'Onest', sans-serif" font-size="11">HMAC-SHA256 Nonce Check</text>
    <text x="180" y="106" fill="#81C784" font-family="monospace" font-size="10" font-weight="700">PASS ✓</text>
  </g>

  <rect x="376" y="270" width="216" height="78" rx="6" fill="#201538" stroke="#7E57C2" stroke-width="1"/>
  <text x="484" y="300" fill="#B39DDB" font-family="'Onest', sans-serif" font-size="18" font-weight="700" text-anchor="middle">22 ENDPOINTS</text>
  <text x="484" y="322" fill="#B5ACA8" font-family="'Onest', sans-serif" font-size="10" text-anchor="middle">Zero breaking contract drifts</text>
</svg>
