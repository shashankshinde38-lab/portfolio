<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgApi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18141F"/>
      <stop offset="100%" stop-color="#241B30"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bgApi)" rx="8"/>
  <rect x="2" y="2" width="636" height="396" fill="none" stroke="#7C4DFF" stroke-width="1.5" stroke-opacity="0.3" rx="7"/>

  <!-- Title -->
  <text x="32" y="48" fill="#E8E4E0" font-family="'Onest', sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">RIDE SHARING · 22 REST ENDPOINTS &amp; HMAC SECURITY</text>
  <rect x="495" y="32" width="113" height="24" rx="12" fill="#7C4DFF" fill-opacity="0.2" stroke="#7C4DFF" stroke-width="1"/>
  <text x="551" y="48" fill="#B388FF" font-family="'Onest', sans-serif" font-size="11" font-weight="600" text-anchor="middle">100% SCHEMA OK</text>

  <!-- Left: Endpoints Column -->
  <rect x="32" y="80" width="220" height="290" rx="6" fill="#130F1A" stroke="#36294C" stroke-width="1"/>
  <text x="46" y="105" fill="#B388FF" font-family="'Onest', sans-serif" font-size="11" font-weight="700">AUTOMATED ENDPOINTS (22)</text>

  <g font-family="monospace" font-size="11">
    <rect x="44" y="120" width="46" height="18" rx="3" fill="#2E7D32" fill-opacity="0.3"/>
    <text x="67" y="133" fill="#4CAF50" text-anchor="middle" font-weight="700">POST</text>
    <text x="98" y="133" fill="#E0D7EC">/v2/rides/dispatch</text>

    <rect x="44" y="150" width="46" height="18" rx="3" fill="#1565C0" fill-opacity="0.3"/>
    <text x="67" y="163" fill="#42A5F5" text-anchor="middle" font-weight="700">GET</text>
    <text x="98" y="163" fill="#E0D7EC">/v2/drivers/nearby</text>

    <rect x="44" y="180" width="46" height="18" rx="3" fill="#C62828" fill-opacity="0.3"/>
    <text x="67" y="193" fill="#EF5350" text-anchor="middle" font-weight="700">POST</text>
    <text x="98" y="193" fill="#E0D7EC">/v2/trips/lock-bid</text>

    <rect x="44" y="210" width="46" height="18" rx="3" fill="#2E7D32" fill-opacity="0.3"/>
    <text x="67" y="223" fill="#4CAF50" text-anchor="middle" font-weight="700">POST</text>
    <text x="98" y="223" fill="#E0D7EC">/v1/webhook/razorpay</text>

    <rect x="44" y="240" width="46" height="18" rx="3" fill="#EF6C00" fill-opacity="0.3"/>
    <text x="67" y="253" fill="#FFA726" text-anchor="middle" font-weight="700">PUT</text>
    <text x="98" y="253" fill="#E0D7EC">/v2/rides/{id}/status</text>

    <rect x="44" y="270" width="46" height="18" rx="3" fill="#1565C0" fill-opacity="0.3"/>
    <text x="67" y="283" fill="#42A5F5" text-anchor="middle" font-weight="700">GET</text>
    <text x="98" y="283" fill="#E0D7EC">/v2/pricing/surge</text>

    <rect x="44" y="300" width="46" height="18" rx="3" fill="#2E7D32" fill-opacity="0.3"/>
    <text x="67" y="313" fill="#4CAF50" text-anchor="middle" font-weight="700">POST</text>
    <text x="98" y="313" fill="#E0D7EC">/v1/auth/token/refresh</text>
  </g>
  <text x="46" y="352" fill="#8E7D9E" font-family="'Onest', sans-serif" font-size="10">+ 15 more contract regression suites</text>

  <!-- Right: Cryptographic Signature & Schema Validation Box -->
  <rect x="268" y="80" width="340" height="290" rx="6" fill="#110D18" stroke="#36294C" stroke-width="1"/>
  <text x="284" y="105" fill="#D4AF37" font-family="'Onest', sans-serif" font-size="11" font-weight="700">SECURITY &amp; SCHEMA ASSERTION LOG</text>

  <g font-family="monospace" font-size="10.5" fill="#E0D7EC">
    <text x="284" y="132" fill="#B388FF">// HMAC-SHA256 Webhook Verification</text>
    <text x="284" y="152">header('X-Razorpay-Signature', sign)</text>
    <text x="284" y="172">header('Idempotency-Key', 'uuid-v4')</text>
    <text x="284" y="192" fill="#4CAF50">Assert: statusCode == 200 OK</text>
    <text x="284" y="212" fill="#4CAF50">Assert: responseTime &lt; 120ms</text>
    
    <text x="284" y="242" fill="#B388FF">// OpenAPI / JSON Schema Contract</text>
    <text x="284" y="262">body(matchesJsonSchema("ride-dispatch.json"))</text>
    <text x="284" y="282">body("status", equalTo("DRIVER_MATCHING"))</text>
    <text x="284" y="302">body("surgeMultiplier", greaterThan(1.0f))</text>
    <text x="284" y="322" fill="#4CAF50">Result: 0 breaking schema drifts detected</text>
  </g>

  <rect x="284" y="338" width="308" height="20" rx="3" fill="#2E7D32" fill-opacity="0.2"/>
  <text x="438" y="352" fill="#81C784" font-family="'Onest', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Newman CLI CI Regression Gate: PASSED</text>
</svg>

