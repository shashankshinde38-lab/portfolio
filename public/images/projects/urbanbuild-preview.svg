<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141C1E"/>
      <stop offset="100%" stop-color="#1C272A"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bgMob)" rx="8"/>
  <rect x="2" y="2" width="636" height="396" fill="none" stroke="#00B4D8" stroke-width="1.5" stroke-opacity="0.3" rx="7"/>

  <!-- Title -->
  <text x="32" y="48" fill="#E8E4E0" font-family="'Onest', sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">URBAN BUILD · APPIUM 2.0 W3C GESTURE &amp; DEBOUNCE</text>
  <rect x="480" y="32" width="128" height="24" rx="12" fill="#00B4D8" fill-opacity="0.2" stroke="#00B4D8" stroke-width="1"/>
  <text x="544" y="48" fill="#90E0EF" font-family="'Onest', sans-serif" font-size="11" font-weight="600" text-anchor="middle">100% OFFLINE SYNC</text>

  <!-- Left: Blueprint Floorplan Simulation -->
  <rect x="32" y="80" width="280" height="290" rx="6" fill="#0C2333" stroke="#0077B6" stroke-width="1.2"/>
  
  <!-- Architectural blueprint grid -->
  <g stroke="#184E77" stroke-width="0.75" opacity="0.6">
    <line x1="32" y1="120" x2="312" y2="120"/>
    <line x1="32" y1="160" x2="312" y2="160"/>
    <line x1="32" y1="200" x2="312" y2="200"/>
    <line x1="32" y1="240" x2="312" y2="240"/>
    <line x1="32" y1="280" x2="312" y2="280"/>
    <line x1="32" y1="320" x2="312" y2="320"/>
    <line x1="80" y1="80" x2="80" y2="370"/>
    <line x1="140" y1="80" x2="140" y2="370"/>
    <line x1="200" y1="80" x2="200" y2="370"/>
    <line x1="260" y1="80" x2="260" y2="370"/>
  </g>

  <!-- Room layouts on blueprint -->
  <rect x="50" y="100" width="120" height="110" fill="none" stroke="#90E0EF" stroke-width="1.8"/>
  <text x="60" y="120" fill="#90E0EF" font-family="monospace" font-size="10">ZONE A: FOUNDATION</text>
  
  <rect x="180" y="100" width="115" height="170" fill="none" stroke="#90E0EF" stroke-width="1.8"/>
  <text x="190" y="120" fill="#90E0EF" font-family="monospace" font-size="10">ZONE B: ELECTRICAL</text>

  <!-- Multi-touch gesture indicator with ripple -->
  <circle cx="110" cy="160" r="18" fill="#FF5252" fill-opacity="0.3" stroke="#FF5252" stroke-width="1"/>
  <circle cx="110" cy="160" r="6" fill="#FF5252"/>
  <circle cx="110" cy="160" r="28" fill="none" stroke="#FF5252" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="110" y="200" fill="#FF8A80" font-family="'Onest', sans-serif" font-size="10" font-weight="700" text-anchor="middle">50ms Double Tap</text>

  <!-- Blueprint status badge -->
  <rect x="44" y="335" width="256" height="24" rx="4" fill="#03045E" fill-opacity="0.6"/>
  <text x="172" y="351" fill="#CAF0F8" font-family="'Onest', sans-serif" font-size="10" text-anchor="middle">Spatial DB: SQLite Room sync verified</text>

  <!-- Right: Appium W3C Code & Diagnostic Box -->
  <rect x="328" y="80" width="280" height="290" rx="6" fill="#10181A" stroke="#23353A" stroke-width="1"/>
  <text x="344" y="105" fill="#00B4D8" font-family="'Onest', sans-serif" font-size="11" font-weight="700">W3C POINTER INPUT AUTOMATION</text>

  <g font-family="monospace" font-size="10.5" fill="#C5D3D6">
    <text x="344" y="132" fill="#90E0EF">// Appium UIAutomator2 sequence</text>
    <text x="344" y="152">finger.createPointerMove(0, Origin, 450, 820)</text>
    <text x="344" y="172">finger.createPointerDown(LEFT)</text>
    <text x="344" y="192">finger.createPointerUp(LEFT)</text>
    <text x="344" y="212" fill="#FF8A80">// Rapid 40ms interval tap 2</text>
    <text x="344" y="232">finger.createPointerDown(LEFT)</text>
    <text x="344" y="252">finger.createPointerUp(LEFT)</text>
    <text x="344" y="280" fill="#4CAF50">// Assert single atomic pin drop</text>
    <text x="344" y="300">assertEquals(pinList.size(), 1)</text>
    <text x="344" y="325" fill="#4CAF50">✓ Debounce filter: 0 duplicates</text>
  </g>

  <rect x="344" y="338" width="248" height="20" rx="3" fill="#2E7D32" fill-opacity="0.2"/>
  <text x="468" y="352" fill="#81C784" font-family="'Onest', sans-serif" font-size="10" font-weight="600" text-anchor="middle">40+ Physical Devices Verified</text>
</svg>

