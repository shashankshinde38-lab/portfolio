<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFleet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111B22"/>
      <stop offset="100%" stop-color="#1A2833"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bgFleet)" rx="8"/>
  <rect x="2" y="2" width="636" height="396" fill="none" stroke="#26A69A" stroke-width="1.5" stroke-opacity="0.3" rx="7"/>

  <!-- Title -->
  <text x="32" y="44" fill="#E8E4E0" font-family="'Onest', sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">MOBILE FLEET · GPS LIFECYCLE &amp; BATTERY DRAIN PROFILING</text>
  <rect x="470" y="28" width="138" height="24" rx="12" fill="#26A69A" fill-opacity="0.25" stroke="#26A69A" stroke-width="1"/>
  <text x="539" y="44" fill="#80CBC4" font-family="'Onest', sans-serif" font-size="11" font-weight="600" text-anchor="middle">50+ DEVICE MATRIX</text>

  <!-- Left: Android Lifecycle & Battery Waveform -->
  <rect x="32" y="76" width="320" height="295" rx="6" fill="#0D151B" stroke="#1E3341" stroke-width="1"/>
  <text x="48" y="102" fill="#D5CDCA" font-family="'Onest', sans-serif" font-size="12" font-weight="700">APP BACKGROUND LIFECYCLE MONITOR</text>

  <!-- Lifecycle States Flow -->
  <g transform="translate(48, 120)">
    <rect x="0" y="0" width="80" height="32" rx="4" fill="#1A3B37" stroke="#26A69A" stroke-width="1"/>
    <text x="40" y="20" fill="#E0F2F1" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">FOREGROUND</text>

    <line x1="80" y1="16" x2="105" y2="16" stroke="#26A69A" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="105" y="0" width="80" height="32" rx="4" fill="#2E2818" stroke="#FFA726" stroke-width="1"/>
    <text x="145" y="20" fill="#FFF3E0" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">ON_STOP()</text>

    <line x1="185" y1="16" x2="210" y2="16" stroke="#FFA726" stroke-width="1.5"/>

    <rect x="210" y="0" width="78" height="32" rx="4" fill="#3E1A1A" stroke="#EF5350" stroke-width="1"/>
    <text x="249" y="20" fill="#FFEBEE" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">DOZE_MODE</text>
  </g>

  <!-- Battery Discharge Curve -->
  <text x="48" y="185" fill="#80CBC4" font-family="monospace" font-size="10">BATTERY CONSUMPTION (mAh) VS GPS ACCURACY</text>
  <path d="M 48 310 Q 110 290 160 250 T 260 220 T 330 195" fill="none" stroke="#26A69A" stroke-width="2.5"/>
  <circle cx="160" cy="250" r="4" fill="#80CBC4"/>
  <text x="160" y="240" fill="#80CBC4" font-family="monospace" font-size="9" text-anchor="middle">Fused Location: 12mAh</text>
  
  <path d="M 48 310 Q 100 240 180 180 T 280 130 T 330 110" fill="none" stroke="#EF5350" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="250" y="145" fill="#EF5350" font-family="monospace" font-size="9">Continuous Raw GPS: 88mAh (Flagged)</text>

  <!-- Right: Device Compatibility Matrix -->
  <rect x="370" y="76" width="238" height="295" rx="6" fill="#0D151B" stroke="#1E3341" stroke-width="1"/>
  <text x="386" y="102" fill="#D5CDCA" font-family="'Onest', sans-serif" font-size="12" font-weight="700">OS &amp; OEM MATRIX</text>

  <g transform="translate(386, 125)">
    <text x="0" y="14" fill="#B5ACA8" font-family="'Onest', sans-serif" font-size="11">Android 14 (OneUI 6.0)</text>
    <text x="180" y="14" fill="#81C784" font-family="monospace" font-size="10" font-weight="700">100%</text>

    <text x="0" y="44" fill="#B5ACA8" font-family="'Onest', sans-serif" font-size="11">Android 13 (Pixel OS)</text>
    <text x="180" y="44" fill="#81C784" font-family="monospace" font-size="10" font-weight="700">100%</text>

    <text x="0" y="74" fill="#B5ACA8" font-family="'Onest', sans-serif" font-size="11">Android 12 (MIUI / HyperOS)</text>
    <text x="180" y="74" fill="#81C784" font-family="monospace" font-size="10" font-weight="700">100%</text>

    <text x="0" y="104" fill="#B5ACA8" font-family="'Onest', sans-serif" font-size="11">Android 11 (Legacy OxygenOS)</text>
    <text x="180" y="104" fill="#81C784" font-family="monospace" font-size="10" font-weight="700">100%</text>
  </g>

  <!-- Metric Callout -->
  <rect x="386" y="270" width="206" height="78" rx="6" fill="#13272E" stroke="#26A69A" stroke-width="1"/>
  <text x="489" y="300" fill="#80CBC4" font-family="'Onest', sans-serif" font-size="18" font-weight="700" text-anchor="middle">0 WAKELOCKS</text>
  <text x="489" y="322" fill="#B5ACA8" font-family="'Onest', sans-serif" font-size="10" text-anchor="middle">No unreleased GPS wakelocks</text>
</svg>
